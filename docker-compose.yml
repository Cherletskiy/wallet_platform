services:
  wallet_db:
    image: postgres:15.17-trixie
    restart: always
    env_file:
      - ./wallet_service/local.env
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
    ports:
      - 5431:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_db:
    image: postgres:15.17-trixie
    restart: always
    env_file:
      - ./auth_service/local.env
    volumes:
      - auth_pg_data:/var/lib/postgresql/data
    ports:
      - 5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification_db:
    image: postgres:15.17-trixie
    restart: always
    env_file:
      - ./notification_service/local.env
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.4
    restart: always
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
    ports:
      - 19092:19092
      - 18082:18082
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  wallet_service:
    build:
      context: ./wallet_service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./wallet_service/local.env
    environment:
      POSTGRES_HOST: wallet_db
    depends_on:
      wallet_db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./auth_service/local.env
    environment:
      POSTGRES_HOST: auth_db
    depends_on:
      auth_db:
        condition: service_healthy

  bff_service:
    build:
      context: ./bff_service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./bff_service/local.env
    ports:
      - 8003:8003
    depends_on:
      auth_service:
        condition: service_started
      wallet_service:
        condition: service_started

  notification_service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./notification_service/local.env
    environment:
      POSTGRES_HOST: notification_db
    depends_on:
      notification_db:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  auth_pg_data:
  wallet_pg_data:
  notification_pg_data:
