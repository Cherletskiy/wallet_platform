services:
  db:
    image: postgres:15.17-trixie
    restart: always
    env_file:
      - local.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - 5434:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 8082:80
    depends_on:
      db:
        condition: service_healthy

  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - local.env
    ports:
      - 8002:8002
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
